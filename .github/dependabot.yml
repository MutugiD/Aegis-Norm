version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Maintainer enables update PRs only when the one-PR queue is empty.
    open-pull-requests-limit: 0
    commit-message:
      prefix: task
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: task
    groups:
      ci-tooling:
        patterns: ['*']
